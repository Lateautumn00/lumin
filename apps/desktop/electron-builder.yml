# Lumin 打包配置：NSIS 安装包 + portable 单文件（Q10；无签名证书）
appId: com.lumin.desktop
productName: Lumin
copyright: Copyright © 2026 Lumin

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  # 体积优化（2026-11-19）：onnxruntime-node 自带全平台原生库，Windows x64 包只保留 win32-x64
  - '!**/onnxruntime-node/bin/napi-v*/darwin/**'
  - '!**/onnxruntime-node/bin/napi-v*/linux/**'
  - '!**/onnxruntime-node/bin/napi-v*/win32/arm64/**'

# Electron 内置语言包裁剪（2026-11-19）：只保留简中/英文，去掉其余 50+ 语言（≈44MB）
electronLanguages:
  - zh-CN
  - en-US

asar: true

# 原生模块不能从 asar 内加载（@napi-rs/canvas / onnxruntime-node 的 .node + 运行时 dll）
asarUnpack:
  - '**/node_modules/@napi-rs/**'
  - '**/node_modules/onnxruntime-node/**'
  - '**/node_modules/onnxruntime-common/**'

# 大二进制经 scripts/fetch-binaries.mjs 拉取到 binaries/（gitignore，M3 起启用）
extraResources:
  - from: ../../binaries/
    to: binaries/
    filter:
      - '**/*'

win:
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Lumin
  artifactName: ${productName}-${version}-${os}-${arch}-setup.${ext}

portable:
  artifactName: ${productName}-${version}-${os}-${arch}-portable.${ext}

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# 更新源（§5.3）：generic provider，latest.yml + blockmap 放仓库 updates/ 固定目录
# M5（2026-11-19）落定实际 Gitee 仓库；换 OSS 只改此处
publish:
  provider: generic
  url: https://gitee.com/Lateautumn00/lumin/raw/master/updates
